services:
  app:
    build: .
    container_name: devknowledge-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: devknowledge
      DB_USERNAME: devknowledge
      DB_PASSWORD: secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - devknowledge

  nginx:
    image: nginx:1.27-alpine
    container_name: devknowledge-nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - devknowledge

  mysql:
    image: mysql:8.4
    container_name: devknowledge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: devknowledge
      MYSQL_USER: devknowledge
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - '33060:3306'
    volumes:
      - devknowledge-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-prootsecret']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devknowledge

  redis:
    image: redis:7-alpine
    container_name: devknowledge-redis
    restart: unless-stopped
    ports:
      - '63790:6379'
    networks:
      - devknowledge

networks:
  devknowledge:
    driver: bridge

volumes:
  devknowledge-mysql:
