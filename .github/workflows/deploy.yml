name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,pdo,pdo_mysql,bcmath,ctype,json,tokenizer,xml,curl,gd
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Run tests
        run: php artisan test --no-coverage
        continue-on-error: true

      - name: Run linting
        run: composer run lint
        continue-on-error: true

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            # Получить последние изменения
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            # Установить зависимости
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev


            # Обновить базу данных
            php artisan migrate --force

            # Очистить кеш
            php artisan cache:clear
            php artisan config:clear
            php artisan view:clear
            php artisan route:clear

            # Запустить оптимизацию
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Установить права доступа
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Перезагрузить приложение (если используется supervisor или systemd)
            sudo systemctl restart php-fpm || true

            echo "✅ Deployment успешно завершен!"

      - name: Install Node.js and build frontend
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: |
          npm install
          npm run build

      - name: Notify on success
        if: success()
        run: echo "🎉 Приложение успешно развернуто на сервер"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Развертывание не удалось. Проверьте логи."
