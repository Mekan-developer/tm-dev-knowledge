name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main  # Оставляем только main, если работаешь в ней

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,pdo,pdo_mysql,bcmath,ctype,json,tokenizer,xml,curl,gd
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies (Local)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Run tests
        run: php artisan test --no-coverage
        continue-on-error: true

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            # 1. Синхронизация кода
            git fetch origin
            git reset --hard origin/main

            # 2. Установка зависимостей и сборка фронтенда
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            npm install
            npm run build

            # 3. Миграции и права (важно для Laravel)
            php artisan migrate --force
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # 4. Оптимизация кеша Laravel
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 5. Перезапуск PHP-FPM
            sudo systemctl restart php-fpm || true

            echo "✅ Deployment на Ubuntu успешно завершен!"

      - name: Notify on success
        if: success()
        run: echo "🎉 Приложение успешно развернуто на сервер"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Развертывание не удалось. Проверьте логи."
