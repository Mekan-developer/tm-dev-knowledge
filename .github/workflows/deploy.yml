name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,pdo,pdo_mysql,bcmath,ctype,json,tokenizer,xml,curl,gd
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies (Local runner)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Run tests
        run: php artisan test --no-coverage
        continue-on-error: true

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            # 1. Исправляем права на папку проекта для пользователя deploy
            # (Теперь sudo сработает без пароля, если ты настроил visudo)
            sudo chown -R $USER:$USER ${{ secrets.PROJECT_PATH }}

            # Разрешаем Git работать в этой папке
            git config --global --add safe.directory ${{ secrets.PROJECT_PATH }}

            cd ${{ secrets.PROJECT_PATH }}

            # 2. Обновление кода
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 3. Зависимости и сборка фронтенда
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            npm install
            npm run build

            # 4. Laravel задачи
            php artisan migrate --force

            # Возвращаем права веб-серверу на нужные папки
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Полная очистка кеша
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 5. Перезапуск PHP-FPM
            sudo systemctl restart php-fpm || true

            echo "🚀 Все готово! Сайт обновлен."

      - name: Notify on success
        if: success()
        run: echo "🎉 Приложение успешно развернуто на сервер"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Развертывание не удалось. Проверьте логи в GitHub Actions."
