name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,pdo,pdo_mysql,bcmath,ctype,json,tokenizer,xml,curl,gd
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4 # Обновил до v4 для поддержки Node 24
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies (Local runner)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Run tests
        run: php artisan test --no-coverage
        continue-on-error: true

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            # 1. Решаем проблему "dubious ownership" (Error 128)
            git config --global --add safe.directory ${{ secrets.PROJECT_PATH }}

            cd ${{ secrets.PROJECT_PATH }}

            # 2. Синхронизация кода
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 3. Установка зависимостей и фронтенд
            # (Убедись, что на сервере есть npm и composer)
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            npm install
            npm run build

            # 4. База данных и права
            php artisan migrate --force

            # Используем sudo для chown, так как это системные права
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # 5. Глубокая очистка и прогрев кеша
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 6. Перезапуск PHP
            sudo systemctl restart php-fpm || true

            echo "✅ Deployment успешно завершен!"

      - name: Notify on success
        if: success()
        run: echo "🎉 Приложение успешно развернуто на сервер"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Развертывание не удалось. Проверьте логи SSH шага."
